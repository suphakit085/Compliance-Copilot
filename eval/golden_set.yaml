# Golden evaluation set for Compliance Copilot.
#
# Each item states WHO asks (user -> role/department/clearance), optionally WHEN (as_of),
# the expected behaviour and the evidence a correct answer must rest on.
#
#   expect:    answer | abstain | block
#   evidence:  list of {doc, text} - a retrieved/cited chunk is "relevant" if it belongs to
#              `doc` and contains `text` (whitespace-normalised). Defined on text rather than
#              chunk ids so the same gold works for every chunking strategy (ablation).
#   key_facts: each entry is a list of acceptable alternatives; the answer must contain at
#              least one alternative of every entry (deterministic correctness check).
#   forbidden_docs: must never be retrieved or cited (access control / superseded versions).
#
# Categories: regulation, policy, conflict, versioning, rbac, explicit_ref, ocr,
#             out_of_scope, unanswerable, injection, pii

items:
  # ------------------------------------------------------------------ PDPA
  - id: pdpa-01
    category: regulation
    user: somchai
    question: ถ้าข้อมูลลูกค้ารั่วไหล ผู้ควบคุมข้อมูลต้องแจ้งสำนักงานคุ้มครองข้อมูลส่วนบุคคลภายในกี่ชั่วโมง
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: แจ้งเหตุการละเมิดข้อมูลส่วนบุคคลแก่สำนักงานโดยไม่ชักช้าภายในเจ็ดสิบสองชั่วโมง}
      - {doc: pdpc-breach-2565, text: ให้ผู้ควบคุมข้อมูลส่วนบุคคลแจ้งเหตุการละเมิดแก่สำนักงานโดยไม่ชักช้าภายในเจ็ดสิบสองชั่วโมง}
    key_facts: [["72", "เจ็ดสิบสอง"]]

  - id: pdpa-02
    category: regulation
    user: somchai
    question: ลูกค้าขอเข้าถึงและขอรับสำเนาข้อมูลส่วนบุคคลของตน ธนาคารต้องดำเนินการให้เสร็จภายในกี่วัน
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: แต่ต้องไม่เกินสามสิบวันนับแต่วันที่ได้รับคำขอ}
    key_facts: [["30", "สามสิบ"]]

  - id: pdpa-03
    category: regulation
    user: somchai
    question: ข้อมูลส่วนบุคคลอ่อนไหวตาม PDPA มีอะไรบ้าง
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ห้ามมิให้เก็บรวบรวมข้อมูลส่วนบุคคลเกี่ยวกับเชื้อชาติ}
    key_facts: [["เชื้อชาติ"], ["ศาสนา", "ลัทธิ"]]

  - id: pdpa-04
    category: regulation
    user: somchai
    question: การขอความยินยอมจากเจ้าของข้อมูลต้องทำในรูปแบบใด
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: การขอความยินยอมต้องทำโดยชัดแจ้ง เป็นหนังสือหรือทำโดยผ่านระบบอิเล็กทรอนิกส์}
    key_facts: [["ชัดแจ้ง"], ["หนังสือ", "อิเล็กทรอนิกส์"]]

  - id: pdpa-05
    category: regulation
    user: nida
    question: กรณีใดบ้างที่ผู้ควบคุมข้อมูลส่วนบุคคลต้องจัดให้มีเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล (DPO)
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ต้องจัดให้มีเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลของตน}
    key_facts: [["หน่วยงานของรัฐ", "จำนวนมาก", "มาตรา 26"]]

  - id: pdpa-06
    category: regulation
    user: nida
    question: ถ้าแจ้งเหตุละเมิดข้อมูลไม่ทันภายใน 72 ชั่วโมงเพราะมีเหตุจำเป็น ผู้ควบคุมข้อมูลทำอะไรได้บ้าง
    expect: answer
    evidence:
      - {doc: pdpc-breach-2565, text: ผู้ควบคุมข้อมูลส่วนบุคคลอาจขอให้สำนักงานพิจารณายกเว้นความผิด}
    key_facts: [["ยกเว้นความผิด", "ขอให้สำนักงานพิจารณา"]]

  - id: pdpa-07
    category: regulation
    user: nida
    question: ผู้ประมวลผลข้อมูลส่วนบุคคลต้องแจ้งเหตุละเมิดแก่ผู้ควบคุมข้อมูลภายในเวลาเท่าไร
    expect: answer
    evidence:
      - {doc: pdpc-breach-2565, text: ให้ผู้ประมวลผลข้อมูลส่วนบุคคลมีหน้าที่แจ้งเหตุการละเมิดข้อมูลส่วนบุคคลแก่ผู้ควบคุมข้อมูลส่วนบุคคล}
    key_facts: [["72", "เจ็ดสิบสอง"]]

  # ------------------------------------------------------------------ AML / CDD
  - id: aml-01
    category: regulation
    user: somchai
    question: ตามกฎหมายฟอกเงิน ต้องเก็บรักษารายละเอียดการตรวจสอบเพื่อทราบข้อเท็จจริงเกี่ยวกับลูกค้า (CDD) นานเท่าไรหลังปิดบัญชี
