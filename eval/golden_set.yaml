    evidence:
      - {doc: amla-2542, text: เป็นเวลาสิบปีนับแต่วันที่มีการปิดบัญชีหรือยุติความสัมพันธ์กับลูกค้า}
    key_facts: [["10 ปี", "สิบปี"]]

  - id: aml-02
