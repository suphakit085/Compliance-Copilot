    user: somchai
    question: ผู้กระทำความผิดฐานฟอกเงินมีโทษอย่างไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ผู้ใดกระทำความผิดฐานฟอกเงิน ต้องระวางโทษจำคุกตั้งแต่หนึ่งปีถึงสิบปี}
    key_facts: [["หนึ่งปีถึงสิบปี", "1 ปีถึง 10 ปี", "1-10 ปี", "1 ถึง 10 ปี"]]

  - id: cdd-01
