# Extended set - anti-money-laundering: พ.ร.บ.ป้องกันและปราบปรามการฟอกเงิน 2542 and the CDD ministerial regulation 2563.
# review: draft (see docs/evaluation-review.md)

items:
  - id: x-aml-01
    category: regulation
    user: somchai
    question: ธนาคารต้องรายงานธุรกรรมแบบไหนให้ ปปง. บ้าง
    expect: answer
    evidence:
      - {doc: amla-2542, text: ธุรกรรมที่ใช้เงินสดมีจำนวนเกินกว่าที่กำหนดในกฎกระทรวง}
    key_facts: [["เงินสด"], ["เหตุอันควรสงสัย"]]

  - id: x-aml-02
    category: regulation
    user: nida
    question: ส่งรายงานธุรกรรมไปแล้ว ต่อมามีข้อเท็จจริงใหม่ที่ช่วยยืนยันหรือยกเลิกข้อมูลเดิม ต้องทำอย่างไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ให้สถาบันการเงินรายงานข้อเท็จจริงนั้น ให้สำนักงานทราบโดยไม่ชักช้า}
    key_facts: [["รายงาน"], ["ไม่ชักช้า"]]

  - id: x-aml-03
    category: regulation
    user: nida
    question: ธุรกรรมที่ตอนนั้นไม่ได้รายงานเพราะไม่น่าสงสัย แต่ภายหลังเชื่อว่าต้องรายงาน ต้องทำอย่างไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ให้สถาบันการเงินรายงานให้สำนักงานทราบโดยไม่ชักช้า}
    key_facts: [["รายงาน"], ["ไม่ชักช้า"]]

  - id: x-aml-04
    category: regulation
    user: somchai
    question: ลูกค้าถามว่าเราส่งรายงานธุรกรรมน่าสงสัยเกี่ยวกับเขาไปหรือยัง บอกเขาได้ไหม
    expect: answer
    evidence:
      - {doc: amla-2542, text: ห้ามมิให้ผู้มีหน้าที่รายงานตามมาตรา 13 และมาตรา 16 หรือบุคคลใดเปิดเผยข้อมูลหรือกระทำด้วยประการใด ๆ อันอาจทำให้ลูกค้าหรือบุคคลภายนอกทราบ}
    key_facts: [["ห้าม", "ไม่ได้"], ["เปิดเผย"]]

  - id: x-aml-05
    category: regulation
    user: somchai
    question: เอกสารที่ลูกค้าใช้แสดงตนต้องเก็บไว้นานเท่าไรหลังปิดบัญชี
    expect: answer
    evidence:
      - {doc: amla-2542, text: เกี่ยวกับการแสดงตนตามมาตรา 20 เป็นเวลาห้าปีนับแต่วันที่มีการปิดบัญชีหรือยุติความสัมพันธ์กับลูกค้า}
    key_facts: [["5 ปี", "ห้าปี"]]

  - id: x-aml-06
    category: regulation
    user: nida
    question: ถ้าเราตรวจสอบข้อเท็จจริงเกี่ยวกับลูกค้าไม่สำเร็จ ต้องทำอะไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ให้สถาบันการเงินและผู้ประกอบอาชีพดังกล่าวรายงานให้สำนักงานทราบโดยทันที}
      - {doc: cdd-2563, text: ให้สถาบันการเงินและผู้ประกอบอาชีพตามมาตรา 16 ปฏิเสธการสร้างความสัมพันธ์ทางธุรกิจ}
    key_facts: [["รายงาน"], ["ทันที"]]

  - id: x-aml-07
    category: regulation
    user: nida
    question: ปปง. สั่งให้ระงับการทำธุรกรรมของลูกค้าที่ตรวจสอบตัวตนไม่ได้ ได้นานเท่าไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ระงับการทำธุรกรรมไว้ก่อนได้ไม่เกินสิบวันทำการ}
    key_facts: [["10 วันทำการ", "สิบวันทำการ"]]

  - id: x-aml-08
    category: regulation
    user: nida
    question: ถ้าสถาบันการเงินไม่รายงานธุรกรรมตามที่กฎหมายฟอกเงินกำหนด มีโทษอย่างไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ต้องระวางโทษปรับไม่เกินหนึ่งล้านบาท และปรับอีกไม่เกินวันละหนึ่งหมื่นบาทตลอดเวลาที่ยังฝ่าฝืนอยู่}
    key_facts: [["1,000,000", "หนึ่งล้าน"], ["10,000", "หนึ่งหมื่น"]]

  - id: x-aml-09
    category: regulation
    user: nida
    question: รายงานธุรกรรมให้ ปปง. โดยใส่ข้อความเท็จหรือปกปิดความจริง มีโทษอย่างไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ต้องระวางโทษจำคุกไม่เกินสองปี หรือปรับตั้งแต่ห้าหมื่นบาทถึงห้าแสนบาท}
    key_facts: [["สองปี", "2 ปี"]]

  - id: x-aml-10
    category: regulation
    user: nida
    question: บริษัทที่กระทำความผิดฐานฟอกเงิน โทษปรับเท่าไร และกรรมการที่สั่งการต้องรับโทษด้วยไหม
    expect: answer
    evidence:
      - {doc: amla-2542, text: นิติบุคคลใดกระทำความผิดตามมาตรา 5 มาตรา 7 มาตรา 8 หรือมาตรา 9 ต้องระวางโทษปรับตั้งแต่สองแสนบาทถึงหนึ่งล้านบาท}
    key_facts: [["200,000", "สองแสน"], ["กรรมการ"]]

  - id: x-aml-11
    category: regulation
    user: somchai
    question: ถ้าพนักงานช่วยให้คนที่ฟอกเงินหลบหนีหรือไม่ถูกลงโทษ ต้องรับโทษอย่างไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ต้องระวางโทษเช่นเดียวกับตัวการในความผิดนั้น}
    key_facts: [["ตัวการ"]]

  - id: x-aml-12
    category: regulation
    user: somchai
    question: ความผิดมูลฐานของการฟอกเงินมีอะไรบ้าง
    expect: answer
    evidence:
      - {doc: amla-2542, text: ความผิดเกี่ยวกับยาเสพติดตามกฎหมายว่าด้วยการป้องกันและปราบปรามยาเสพติด}
    key_facts: [["ยาเสพติด"], ["ฉ้อโกง"]]

  - id: x-aml-13
    category: regulation
    user: somchai
    question: กฎหมายฟอกเงินนับบริษัทหลักทรัพย์เป็นสถาบันการเงินด้วยไหม
    expect: answer
    evidence:
      - {doc: amla-2542, text: บริษัทหลักทรัพย์ตามกฎหมายว่าด้วยหลักทรัพย์และตลาดหลักทรัพย์}
    key_facts: [["บริษัทหลักทรัพย์"], ["สถาบันการเงิน"]]

  - id: x-aml-14
    category: regulation
    user: nida
    question: ธนาคารต้องมีนโยบายอะไรเกี่ยวกับการรับลูกค้าตามกฎหมายฟอกเงิน
    expect: answer
    evidence:
      - {doc: amla-2542, text: ต้องกำหนดนโยบายการรับลูกค้า การบริหารความเสี่ยงที่อาจเกี่ยวกับการฟอกเงินของลูกค้า}
    key_facts: [["นโยบายการรับลูกค้า"], ["ความเสี่ยง"]]

  - id: x-aml-15
    category: regulation
    user: somchai
    question: ธุรกรรมที่มีเหตุอันควรสงสัยหมายความว่าอะไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ธุรกรรมที่มีเหตุอันควรเชื่อได้ว่ากระทำขึ้นเพื่อหลีกเลี่ยงมิให้ต้องตกอยู่ภายใต้บังคับแห่งพระราชบัญญัตินี้}
    key_facts: [["หลีกเลี่ยง"]]

  - id: x-aml-16
    category: regulation
    user: nida
    question: เจ้าหน้าที่ที่ผ่านการอบรมด้านฟอกเงินแล้ว ต้องให้ทำหน้าที่อะไรในองค์กร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ต้องจัดให้ผู้ได้รับการฝึกอบรมดังกล่าวปฏิบัติหน้าที่ในการจัดทำรายงานหรือควบคุมการจัดทำรายงาน}
    key_facts: [["รายงาน"], ["แสดงตน", "ตรวจสอบ"]]

  - id: x-aml-17
    category: regulation
    user: nida
    question: ลูกค้าอยู่ในประเทศความเสี่ยงสูงที่ ปปง. ประกาศ ต้องทำอะไรเพิ่ม
    expect: answer
    evidence:
      - {doc: cdd-2563, text: จำกัดการสร้างความสัมพันธ์ทางธุรกิจหรือการทำธุรกรรม}
    key_facts: [["จำกัด"], ["ทบทวน"]]

  - id: x-aml-18
    category: regulation
    user: somchai
    question: ลูกค้าบอกว่าจะใช้ชื่อแฝงเปิดบัญชี ทำได้ไหม
    expect: answer
    evidence:
      - {doc: cdd-2563, text: ห้ามสถาบันการเงินและผู้ประกอบอาชีพตามมาตรา 16 สร้างความสัมพันธ์ทางธุรกิจหรือทำธุรกรรมเป็นครั้งคราวกับลูกค้าที่ปกปิดชื่อจริงหรือใช้ชื่อแฝง}
    key_facts: [["ไม่ได้", "ห้าม"]]

  - id: x-aml-19
    category: regulation
    user: somchai
    question: ลูกค้าทั่วไปมาทำธุรกรรมครั้งเดียวมูลค่าเท่าไรขึ้นไปจึงต้องตรวจสอบข้อเท็จจริงลูกค้า
    expect: answer
    evidence:
      - {doc: cdd-2563, text: ไม่ว่าครั้งเดียวซึ่งมีมูลค่าตั้งแต่หนึ่งแสนบาทขึ้นไป}
    key_facts: [["100,000", "หนึ่งแสน", "1 แสน"]]

  - id: x-aml-20
    category: regulation
    user: somchai
    question: โอนเงินอิเล็กทรอนิกส์ครั้งละเท่าไรขึ้นไปที่ต้องตรวจสอบลูกค้า
    expect: answer
    evidence:
      - {doc: cdd-2563, text: ในแต่ละครั้งซึ่งมีมูลค่าตั้งแต่ห้าหมื่นบาทขึ้นไป}
    key_facts: [["50,000", "ห้าหมื่น"]]

  - id: x-aml-21
    category: regulation
    user: nida
    question: ลูกค้าเป็นบริษัท ต้องระบุผู้ได้รับผลประโยชน์ที่แท้จริงอย่างไร
    expect: answer
    evidence:
      - {doc: cdd-2563, text: ระบุบุคคลธรรมดาซึ่งเป็นผู้ใช้อำนาจควบคุมนิติบุคคล}
    key_facts: [["บุคคลธรรมดา"], ["ควบคุม"]]

  - id: x-aml-22
    category: regulation
    user: nida
    question: ลูกค้าประเภทไหนที่ไม่ต้องระบุผู้ได้รับผลประโยชน์ที่แท้จริง
    expect: answer
    evidence:
      - {doc: cdd-2563, text: บริษัทที่มีหลักทรัพย์จดทะเบียนในตลาดหลักทรัพย์}
    key_facts: [["จดทะเบียน"], ["รัฐ", "หน่วยงานของรัฐ"]]

  - id: x-aml-23
    category: regulation
    user: nida
    question: ต้องประเมินความเสี่ยงฟอกเงินภายในองค์กรโดยพิจารณาปัจจัยอะไรบ้าง
    expect: answer
    evidence:
      - {doc: cdd-2563, text: นำปัจจัยความเสี่ยงที่เกี่ยวกับลูกค้า พื้นที่หรือประเทศ ผลิตภัณฑ์หรือบริการ ธุรกรรมหรือช่องทางในการให้บริการ}
    key_facts: [["ลูกค้า"], ["ผลิตภัณฑ์"], ["ช่องทาง"]]

  - id: x-aml-24
    category: regulation
    user: nida
    question: จะออกผลิตภัณฑ์หรือเทคโนโลยีใหม่ ต้องทำอะไรเกี่ยวกับความเสี่ยงฟอกเงินก่อน
    expect: answer
    evidence:
      - {doc: cdd-2563, text: ระบุและประเมินความเสี่ยงและกำหนดมาตรการที่เหมาะสมสำหรับการบริหารและบรรเทาความเสี่ยงก่อนการออกผลิตภัณฑ์ใหม่}
    key_facts: [["ประเมินความเสี่ยง"], ["ก่อน"]]

  - id: x-aml-25
    category: regulation
    user: nida
    question: นโยบายบริหารความเสี่ยงฟอกเงินขององค์กรต้องผ่านการอนุมัติจากใคร
    expect: answer
    evidence:
      - {doc: cdd-2563, text: ผ่านความเห็นชอบและได้รับอนุมัติจากผู้บริหารระดับสูงหรือคณะกรรมการ}
    key_facts: [["ผู้บริหารระดับสูง", "คณะกรรมการ"]]

  - id: x-aml-26
    category: explicit_ref
    user: nida
    question: พ.ร.บ.ฟอกเงิน มาตรา 21 กำหนดให้ทำอะไร
    expect: answer
    evidence:
      - {doc: amla-2542, text: ให้สถาบันการเงินบันทึกข้อเท็จจริงต่าง ๆ เกี่ยวกับธุรกรรมดังกล่าว}
    key_facts: [["บันทึก"]]

  - id: x-aml-27
    category: explicit_ref
    user: nida
    question: กฎกระทรวง CDD ข้อ 6 ให้ทำอะไรเกี่ยวกับข้อมูลลูกค้า
    expect: answer
    evidence:
      - {doc: cdd-2563, text: ปรับปรุงข้อมูลต่าง ๆของลูกค้าที่ใช้ในการแสดงตน การระบุตัวตน}
    key_facts: [["ปรับปรุง", "เป็นปัจจุบัน"]]
