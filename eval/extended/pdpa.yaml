# Extended set - PDPA (พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล 2562) and the PDPC breach notification.
# Written from the statute text; evidence strings are machine-checked against the corpus.
# review: draft = not yet checked by a compliance expert (see docs/evaluation-review.md)

items:
  - id: x-pdpa-01
    category: regulation
    user: somchai
    question: ลูกค้าขอให้ลบข้อมูลของเขาออกจากระบบ เราต้องลบให้ในกรณีไหนบ้าง
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: เมื่อข้อมูลส่วนบุคคลหมดความจำเป็นในการเก็บรักษาไว้ตามวัตถุประสงค์ในการเก็บรวบรวมใช้ หรือเปิดเผยข้อมูลส่วนบุคคล}
    key_facts: [["หมดความจำเป็น"], ["ถอนความยินยอม"]]

  - id: x-pdpa-02
    category: regulation
    user: somchai
    question: อยากเอาข้อมูลที่ลูกค้าให้ไว้ตอนเปิดบัญชีไปใช้ทำโปรโมชันอย่างอื่นที่ไม่เคยแจ้งไว้ ทำได้ไหม
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ได้แจ้งวัตถุประสงค์ใหม่นั้นให้เจ้าของข้อมูลส่วนบุคคลทราบและได้รับความยินยอมก่อนเก็บรวบรวม ใช้ หรือเปิดเผยแล้ว}
    key_facts: [["ยินยอม"], ["แจ้ง"]]

  - id: x-pdpa-03
    category: regulation
    user: nida
    question: จะส่งข้อมูลลูกค้าไปเก็บบนคลาวด์ที่อยู่ต่างประเทศต้องดูเรื่องอะไรก่อน
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ประเทศปลายทางหรือองค์การระหว่างประเทศที่รับข้อมูลส่วนบุคคลต้องมีมาตรฐานการคุ้มครองข้อมูลส่วนบุคคลที่เพียงพอ}
    key_facts: [["เพียงพอ"]]

  - id: x-pdpa-04
    category: regulation
    user: somchai
    question: ตอนเก็บข้อมูลลูกค้า ต้องบอกลูกค้าอะไรบ้าง
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: วัตถุประสงค์ของการเก็บรวบรวมเพื่อการนำข้อมูลส่วนบุคคลไปใช้หรือเปิดเผย}
    key_facts: [["วัตถุประสงค์"], ["ระยะเวลา"]]

  - id: x-pdpa-05
    category: regulation
    user: nida
    question: เก็บข้อมูลลูกค้าโดยไม่ต้องขอความยินยอมได้ในกรณีใดบ้าง
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: เป็นการจำเป็นเพื่อการปฏิบัติตามสัญญาซึ่งเจ้าของข้อมูลส่วนบุคคลเป็นคู่สัญญา}
    key_facts: [["สัญญา"], ["ปฏิบัติตามกฎหมาย", "กฎหมาย"]]

  - id: x-pdpa-06
    category: regulation
    user: somchai
    question: ลูกค้าอยากถอนความยินยอมที่เคยให้ไว้ ทำให้ยากกว่าตอนให้ความยินยอมได้ไหม
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ต้องถอนความยินยอมได้ง่ายเช่นเดียวกับการให้ความยินยอม}
    key_facts: [["ง่าย"]]

  - id: x-pdpa-07
    category: regulation
    user: somchai
    question: ฝ่ายการตลาดอยากให้ลูกค้าติ๊กยินยอมรับโปรโมชันเป็นเงื่อนไขของการเปิดบัญชี ทำได้ไหม
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ต้องไม่มีเงื่อนไขในการให้ความยินยอมเพื่อเก็บรวบรวม ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลที่ไม่มีความจำเป็นหรือเกี่ยวข้องสำหรับการเข้าทำสัญญา}
    key_facts: [["ไม่ได้", "ห้าม", "ต้องไม่", "ไม่ควร"]]

  - id: x-pdpa-08
    category: regulation
    user: nida
    question: ลูกค้าคัดค้านไม่ให้ใช้ข้อมูลเพื่อส่งโฆษณา เราต้องทำอย่างไร
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: กรณีที่เป็นการเก็บรวบรวม ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลเพื่อวัตถุประสงค์เกี่ยวกับการตลาดแบบตรง}
    key_facts: [["คัดค้าน"], ["ไม่สามารถ", "ไม่ได้", "ต้องหยุด"]]

  - id: x-pdpa-09
    category: regulation
    user: nida
    question: ลูกค้าบอกว่าข้อมูลของเขาในระบบไม่ถูกต้อง ขอให้แก้ไข ถ้าเราไม่แก้ไขให้ต้องทำอย่างไร
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ผู้ควบคุมข้อมูลส่วนบุคคลต้องบันทึกคำร้องขอของเจ้าของข้อมูลส่วนบุคคลพร้อมด้วยเหตุผลไว้ในรายการ}
    key_facts: [["บันทึก"], ["เหตุผล"]]

  - id: x-pdpa-10
    category: regulation
    user: nida
    question: ต้องบันทึกรายการกิจกรรมการประมวลผลข้อมูลอย่างน้อยมีอะไรบ้าง
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: วัตถุประสงค์ของการเก็บรวบรวมข้อมูลส่วนบุคคลแต่ละประเภท}
    key_facts: [["วัตถุประสงค์"], ["ระยะเวลา"]]

  - id: x-pdpa-11
    category: regulation
    user: nida
    question: บริษัทที่ธนาคารจ้างมาประมวลผลข้อมูลลูกค้าต้องทำตามอะไร
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ดำเนินการเกี่ยวกับการเก็บรวบรวม ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลตามคำสั่งที่ได้รับจากผู้ควบคุมข้อมูลส่วนบุคคลเท่านั้น}
    key_facts: [["คำสั่ง"], ["ความมั่นคงปลอดภัย", "รักษาความปลอดภัย"]]

  - id: x-pdpa-12
    category: regulation
    user: nida
    question: DPO ของบริษัทเป็นพนักงานของเราเองหรือจ้างบริษัทภายนอกมาทำหน้าที่ได้ไหม
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: เจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลอาจเป็นพนักงานของผู้ควบคุมข้อมูลส่วนบุคคลหรือผู้ประมวลผลข้อมูลส่วนบุคคลหรือเป็นผู้รับจ้างให้บริการตามสัญญา}
    key_facts: [["ได้"], ["พนักงาน"], ["ผู้รับจ้าง", "ตามสัญญา", "ภายนอก"]]

  - id: x-pdpa-13
    category: regulation
    user: nida
    question: ถ้าฝ่าฝืนเรื่องข้อมูลอ่อนไหวหรือส่งข้อมูลออกนอกประเทศโดยไม่ถูกต้อง โทษปรับทางปกครองสูงสุดเท่าไร
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ต้องระวางโทษปรับทางปกครองไม่เกินห้าล้านบาท}
    key_facts: [["5,000,000", "ห้าล้าน", "5 ล้าน"]]

  - id: x-pdpa-14
    category: regulation
    user: nida
    question: ไม่แจ้งรายละเอียดตามมาตรา 23 ให้เจ้าของข้อมูลทราบ มีโทษปรับทางปกครองสูงสุดเท่าไร
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: หรือไม่ปฏิบัติตามมาตรา 23 ซึ่งได้นำมาใช้บังคับโดยอนุโลมตามมาตรา 25 วรรคสอง ต้องระวางโทษปรับทางปกครองไม่เกินหนึ่งล้านบาท}
    key_facts: [["1,000,000", "หนึ่งล้าน", "1 ล้าน"]]

  - id: x-pdpa-15
    category: regulation
    user: nida
    question: ลูกค้าฟ้องเรียกค่าเสียหายจากเหตุข้อมูลรั่ว มีอายุความกี่ปี และศาลสั่งให้จ่ายเพิ่มเพื่อลงโทษได้สูงสุดเท่าไร
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: แต่ไม่เกินสองเท่าของค่าสินไหมทดแทนที่แท้จริงนั้น}
      - {doc: pdpa-2562, text: เป็นอันขาดอายุความเมื่อพ้นสามปีนับแต่วันที่ผู้เสียหายรู้ถึงความเสียหาย}
    key_facts: [["สามปี", "3 ปี"], ["สองเท่า", "2 เท่า"]]

  - id: x-pdpa-16
    category: regulation
    user: somchai
    question: ลูกค้าขอให้ส่งข้อมูลของเขาไปให้ธนาคารอื่น เราต้องทำให้ไหม
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ขอให้ผู้ควบคุมข้อมูลส่วนบุคคลส่งหรือโอนข้อมูลส่วนบุคคลในรูปแบบดังกล่าวไปยังผู้ควบคุมข้อมูลส่วนบุคคลอื่น}
    key_facts: [["รูปแบบ"], ["สิทธิ", "ขอ"]]

  - id: x-pdpa-17
    category: explicit_ref
    user: nida
    question: PDPA มาตรา 41 พูดถึงเรื่องอะไร
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: ต้องจัดให้มีเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลของตน}
    key_facts: [["เจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล", "DPO"]]

  - id: x-pdpa-18
    category: explicit_ref
    user: nida
    question: มาตรา 33 ของ พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคลให้สิทธิอะไรกับเจ้าของข้อมูล
    expect: answer
    evidence:
      - {doc: pdpa-2562, text: เจ้าของข้อมูลส่วนบุคคลมีสิทธิขอให้ผู้ควบคุมข้อมูลส่วนบุคคลดำเนินการลบหรือทำลาย}
    key_facts: [["ลบ", "ทำลาย"]]
