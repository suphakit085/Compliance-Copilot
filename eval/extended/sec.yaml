# Extended set - SEC: ประกาศ ทธ. 35/2556 (standards of conduct for securities and derivatives business).
# review: draft (see docs/evaluation-review.md)

items:
  - id: x-sec-01
    category: regulation
    user: nida
    question: บริษัทหลักทรัพย์ทำสัญญากับลูกค้าให้ตัวเองไม่ต้องรับผิดชอบความเสียหายที่เกิดจากความประมาทของพนักงานได้ไหม
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ผู้ประกอบธุรกิจต้องไม่ทำข้อตกลงกับลูกค้าในลักษณะเป็นการตัดหรือจำกัดความรับผิดของผู้ประกอบธุรกิจ}
    key_facts: [["ไม่ได้", "ห้าม", "ต้องไม่"], ["ความรับผิด"]]

  - id: x-sec-02
    category: regulation
    user: nida
    question: ระบบจัดเก็บเอกสารและข้อมูลลูกค้าของบริษัทหลักทรัพย์ต้องป้องกันอะไรบ้าง
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ระบบตาม (1) ต้องสามารถป้องกัน}
    key_facts: [["แก้ไข", "สูญหาย", "ถูกทำลาย"], ["เข้าถึง"]]

  - id: x-sec-03
    category: regulation
    user: nida
    question: นโยบายป้องกันความขัดแย้งทางผลประโยชน์ของบริษัทหลักทรัพย์ต้องผ่านการเห็นชอบจากใคร
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ต้องกำหนดนโยบายป้องกันและจัดการความขัดแย้ง}
    key_facts: [["คณะกรรมการ"], ["ลายลักษณ์อักษร"]]

  - id: x-sec-04
    category: regulation
    user: somchai
    question: บริษัทหลักทรัพย์เอาบัญชีซื้อขายของลูกค้าไปใช้ทำประโยชน์ให้ตัวเองได้ไหม
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ผู้ประกอบธุรกิจต้องไม่ใช้บัญชีซื้อขายหรือบัญชีเพื่อการทำธุรกรรมเกี่ยวกับผลิตภัณฑ์ในตลาดทุนของลูกค้า}
    key_facts: [["ไม่ได้", "ห้าม", "ต้องไม่"]]

  - id: x-sec-05
    category: regulation
    user: nida
    question: ถ้าจำเป็นต้องทำธุรกรรมที่มีความขัดแย้งทางผลประโยชน์กับลูกค้า ต้องทำตามเงื่อนไขอะไร
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: เป็นการทำธุรกรรมในลักษณะที่เป็นธรรมเนียมทางค้าปกติ}
    key_facts: [["ประโยชน์ที่ดีที่สุด", "ประโยชน์ของลูกค้า", "ประโยชน์"], ["at arm", "ธรรมเนียมทางค้าปกติ"]]

  - id: x-sec-06
    category: regulation
    user: nida
    question: ทำธุรกรรมที่มีความขัดแย้งทางผลประโยชน์เสร็จแล้ว ต้องบอกลูกค้าไหม
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ให้เปิดเผยผล}
    key_facts: [["เปิดเผย"], ["ลูกค้า"]]

  - id: x-sec-07
    category: regulation
    user: somchai
    question: ลูกค้าใหม่ที่มาใช้บริการ ต้องเปิดเผยข้อมูลอะไรให้ลูกค้าทราบก่อนบ้าง
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ผู้ประกอบธุรกิจต้องเปิดเผยข้อมูลอย่างน้อยในเรื่องดังต่อไปนี้ให้ลูกค้าทราบ}
    key_facts: [["เงื่อนไข", "ขอบเขต"], ["ความขัดแย้งทางผลประโยชน์"]]

  - id: x-sec-08
    category: regulation
    user: somchai
    question: ก่อนเริ่มให้บริการลงทุนแก่ลูกค้า ต้องรวบรวมและประเมินข้อมูลลูกค้าเพื่ออะไรบ้าง
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ผู้ประกอบธุรกิจต้องรวบรวมและประเมินข้อมูลของลูกค้าเพื่อวัตถุประสงค์ดังต่อไปนี้}
    key_facts: [["ทำความรู้จักลูกค้า", "รู้จักลูกค้า"], ["ความเหมาะสม"]]

  - id: x-sec-09
    category: regulation
    user: somchai
    question: ข้อมูลลูกค้าที่ต้องเก็บเพื่อประเมินความเหมาะสมในการลงทุนมีอะไรบ้าง
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ความเสี่ยงที่ยอมรับได้}
    key_facts: [["ประสบการณ์"], ["วัตถุประสงค์"], ["ความเสี่ยงที่ยอมรับได้"]]

  - id: x-sec-10
    category: regulation
    user: somchai
    question: ลูกค้าไม่ยอมให้ข้อมูลสำหรับจัดประเภทลูกค้า ต้องจัดเป็นลูกค้าประเภทไหน
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ให้ผู้ประกอบธุรกิจให้บริการลูกค้าโดยจัดเป็นประเภทลูกค้าทั่วไป}
    key_facts: [["ลูกค้าทั่วไป"]]

  - id: x-sec-11
    category: regulation
    user: somchai
    question: ถ้าประเมินแล้วว่าลูกค้าไม่มีความสามารถปฏิบัติตามข้อตกลงในการใช้บริการ ต้องทำอย่างไร
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ให้ผู้ประกอบธุรกิจปฏิเสธการให้บริการหรือจำกัดขอบเขตการให้บริการ}
    key_facts: [["ปฏิเสธ"], ["จำกัด"]]

  - id: x-sec-12
    category: regulation
    user: somchai
    question: พนักงานเร่งให้ลูกค้ารีบตัดสินใจลงทุนวันนี้ได้ไหม
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ไม่เร่งรัดให้ลูกค้าตัดสินใจลงทุน}
    key_facts: [["ไม่ได้", "ห้าม", "ต้องไม่", "ไม่เร่งรัด"], ["เวลา"]]

  - id: x-sec-13
    category: regulation
    user: somchai
    question: ก่อนแนะนำผลิตภัณฑ์ลงทุน ต้องศึกษาข้อมูลอะไรของผลิตภัณฑ์นั้นบ้าง
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ลักษณะ โครงสร้าง เงื่อนไข และผลตอบแทนของผลิตภัณฑ์ในตลาดทุน}
    key_facts: [["ความเสี่ยง"], ["สภาพคล่อง"], ["ค่าธรรมเนียม"]]

  - id: x-sec-14
    category: regulation
    user: nida
    question: ต้องการให้ลูกค้าลงทุนในสิ่งที่ไม่เหมาะกับฐานะการเงินของเขา ทำได้ไหม
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ผู้ประกอบธุรกิจต้องไม่สนับสนุนหรือให้ความร่วมมือกับลูกค้าในการใช้บริการ}
    key_facts: [["ไม่ได้", "ห้าม", "ต้องไม่"], ["ฐานะทางการเงิน", "เหมาะสม"]]

  - id: x-sec-15
    category: regulation
    user: nida
    question: บริษัทหลักทรัพย์สองแห่งจะร่วมกันให้บริการลูกค้า ต้องทำเอกสารอะไร
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ทำข้อตกลงหรือสัญญาระหว่างผู้ประกอบธุรกิจที่ร่วมกันให้บริการ}
    key_facts: [["ข้อตกลง", "สัญญา"], ["หน้าที่", "ความรับผิดชอบ"]]

  - id: x-sec-16
    category: regulation
    user: somchai
    question: บริษัทหลักทรัพย์ที่ขายบริการอื่นด้วย ต้องแยกพื้นที่ให้บริการเรื่องลงทุนอย่างไร
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: มีการแบ่งแยกพื้นที่ในการติดต่อหรือให้บริการลูกค้าออกจากพื้นที่การประกอบธุรกิจอื่นหรือให้บริการอื่นอย่างเป็นสัดส่วน}
    key_facts: [["แบ่งแยก", "แยก"], ["ป้าย", "สัญลักษณ์"]]

  - id: x-sec-17
    category: explicit_ref
    user: nida
    question: ประกาศ ทธ. 35/2556 ข้อ 21 ห้ามอะไร
    expect: answer
    evidence:
      - {doc: sec-tt-35-2556, text: ผู้ประกอบธุรกิจต้องไม่ใช้บัญชีซื้อขายหรือบัญชีเพื่อการทำธุรกรรมเกี่ยวกับผลิตภัณฑ์ในตลาดทุนของลูกค้า}
    key_facts: [["บัญชีซื้อขาย", "บัญชี"]]
