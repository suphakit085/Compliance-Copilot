      - {doc: bot-responsible-lending-2566, text: ต้องแจ้งผู้ค้ำประกันถึงสิทธิและขอบเขตความรับผิดชอบตามข้อสัญญาและกฎหมายที่เกี่ยวข้อง ก่อนผู้ค้ำประกันลงนามในสัญญา}
