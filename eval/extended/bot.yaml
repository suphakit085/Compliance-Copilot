items:
  - id: x-bot-01
    category: regulation
    user: somchai
    question: ตอนเสนอขายสินเชื่อ ต้องแจ้งลูกค้าว่าถ้าผิดนัดชำระหนี้จะเกิดอะไรขึ้นบ้าง
