    evidence:
      - {doc: bot-responsible-lending-2566, text: แจ้งผลที่อาจเกิดขึ้นจากการผิดนัดชำระหนี้ โดยอย่างน้อยต้องแจ้งข้อมูลดังต่อไปนี้}
    key_facts: [["ดอกเบี้ย", "เบี้ยปรับ"], ["ฟ้อง", "ดำเนินการตามกฎหมาย", "โอนขายหนี้", "บอกเลิกสัญญา"]]

  - id: x-bot-02
