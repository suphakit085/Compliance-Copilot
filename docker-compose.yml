services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compliance-copilot-db
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local identity provider for trying single sign-on:  docker compose --profile sso up -d keycloak
  # Realm, client and demo users are imported from config/keycloak/ (test values only).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    container_name: compliance-copilot-idp
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8081"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
