# Public regulatory corpus (Thai banking & securities compliance).
#
# Each entry is fetched by `copilot fetch` into data/raw/<id>.pdf and pinned in
# data/raw/manifest.lock.json (sha256 + retrieved_at) for provenance.
#
# `url` is where we download from. When the official host (ราชกิจจานุเบกษา, ก.ล.ต.)
# blocks automated clients we use a reputable mirror and keep the official
# reference in `official_ref` / `official_url` so users can verify against the source.
#
# Thai law texts, ministerial regulations and regulator notifications are not
# copyright works (พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7).

