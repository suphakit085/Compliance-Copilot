global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

# Route alerts with Alertmanager (e-mail, Teams, PagerDuty ...) by adding an `alerting:` block.
scrape_configs:
  - job_name: compliance-copilot-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/copilot_metrics_token
    static_configs:
      - targets: ["api:8000"]
