version: 2
# Minor and patch updates arrive grouped, one PR per ecosystem. Major versions (and non-LTS
# runtimes) are ignored here and upgraded deliberately, with the full test suite and evaluation.
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups:
      python-minor-patch: {update-types: [minor, patch]}
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      web-minor-patch: {update-types: [minor, patch]}
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories: [/, /web]
    schedule: {interval: monthly}
    ignore:
      - dependency-name: python
        versions: [">=3.13"]       # move Python deliberately (torch/thai NLP wheels lag new releases)
      - dependency-name: node
        versions: [">=25"]         # stay on LTS releases
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
